<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>출석체크 | FaithOn</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .select-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
            min-width: 200px;
        }
        
        .select-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .form-select, .form-input {
            width: 100%;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: inherit;
            outline: none;
            transition: var(--transition-fast);
        }
        
        .form-select:focus, .form-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px var(--accent-light);
        }
        
        /* Table Styles */
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        
        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .data-table th {
            text-align: left;
            padding: 1rem;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.85rem;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
        }
        
        .data-table td {
            padding: 1rem;
            background: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition-fast);
        }
        
        .data-table tr:last-child td {
            border-bottom: none;
        }
        
        .data-table tr:hover td {
            background: var(--surface-hover);
        }
        
        /* Custom Checkbox */
        .check-container {
            display: block;
            position: relative;
            padding-left: 35px;
            margin-bottom: 0;
            cursor: pointer;
            font-size: 22px;
            user-select: none;
            height: 25px;
        }

        .check-container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 24px;
            width: 24px;
            background-color: #fff;
            border-radius: 6px;
            border: 2px solid var(--border-color);
            transition: var(--transition-fast);
        }

        .check-container:hover input ~ .checkmark {
            border-color: var(--accent-color);
        }

        .check-container input:checked ~ .checkmark {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }

        .check-container input:checked ~ .checkmark:after {
            display: block;
        }

        .check-container .checkmark:after {
            left: 7px;
            top: 3px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            font-size: 1rem;
            color: var(--accent-color);
        }
    </style>
</head>
<body>
    <!-- Mobile Top Bar -->
    <header class="mobile-top-bar">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
            <div class="brand-icon" style="width: 30px; height: 30px; font-size: 0.9rem;">
                <i class="fa-solid fa-church"></i>
            </div>
            <span style="font-weight: 800; color: var(--accent-color); font-size: 1.15rem;">FaithOn</span>
        </div>
        <div style="display: flex; align-items: center; gap: 0.75rem;">
            <span id="mobileUserDisplay" style="font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);">31구역</span>
            <button onclick="logout()" style="color: var(--danger-color); font-size: 0.95rem; padding: 4px;">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </header>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-church"></i>
                </div>
                <div class="brand-text">FaithOn</div>
            </div>
            <nav class="nav-menu">
                <a href="/" class="nav-item">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>대시보드</span>
                </a>
                <a href="/attend.html" class="nav-item active">
                    <i class="fa-solid fa-clipboard-user"></i>
                    <span>출석체크</span>
                </a>
                <a href="/reserve.html" class="nav-item" id="navReserve" style="display: none;">
                    <i class="fa-solid fa-users-slash"></i>
                    <span>예비명단 관리</span>
                </a>
                <a href="/newcomer.html" class="nav-item" id="navNewcomer">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>새참자 관리</span>
                </a>
                <a href="/admin_users.html" class="nav-item" id="navAdminUsers" style="display: none;">
                    <i class="fa-solid fa-user-shield"></i>
                    <span>관리자 설정</span>
                </a>
            </nav>

            <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
                <div id="userProfile" style="font-size: 0.85rem; margin-bottom: 0.75rem;">
                    <div style="font-weight: 600; color: var(--text-primary);" id="userNameDisplay">접속자 정보</div>
                    <div style="color: var(--text-secondary); font-size: 0.8rem;" id="userRoleDisplay">구역 확인 중...</div>
                </div>
                <button class="btn btn-outline" style="width: 100%; font-size: 0.8rem; padding: 0.4rem;" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> 로그아웃
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">출석 체크</h1>
                    <p class="page-subtitle" id="pageSubTitle">구역 성도들의 출석을 확인하세요. (클릭 시 실시간 자동 저장)</p>
                </div>
                <div class="header-actions">
                    <div id="saveStatusIndicator" style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--success-color); background: rgba(16, 185, 129, 0.08); padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid rgba(16, 185, 129, 0.2); font-weight: 600;">
                        <i class="fa-solid fa-cloud-arrow-up" style="color: var(--success-color);"></i> 실시간 자동 저장
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="filter-bar">
                    <div class="select-group">
                        <label class="select-label">출석유형</label>
                        <select class="form-select" id="sessionType">
                            <option value="sunday">주일말씀</option>
                            <option value="wednesday">수요말씀</option>
                        </select>
                    </div>
                    <div class="select-group">
                        <label class="select-label">출석일자 (최근 4주)</label>
                        <select class="form-select" id="attendDate">
                            <!-- JS Will Render 4 Valid Dates -->
                        </select>
                    </div>
                    <div class="select-group">
                        <label class="select-label" id="areaSelectLabel">구역 선택</label>
                        <select class="form-select" id="areaCode">
                            <!-- JS Will Populate Based on Role -->
                        </select>
                    </div>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 50px; text-align: center;">순번</th>
                                <th>성도 정보 & 직분</th>
                                <th style="text-align: center; width: 140px;">출석 체크</th>
                            </tr>
                        </thead>
                        <tbody id="memberList">
                            <!-- JS Will Render Here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav">
        <div class="mobile-bottom-nav-inner">
            <a href="/" class="mobile-nav-item">
                <i class="fa-solid fa-chart-pie"></i>
                <span>대시보드</span>
            </a>
            <a href="/attend.html" class="mobile-nav-item active">
                <i class="fa-solid fa-clipboard-user"></i>
                <span>출석체크</span>
            </a>
            <a href="/newcomer.html" class="mobile-nav-item">
                <i class="fa-solid fa-user-plus"></i>
                <span>새참자</span>
            </a>
            <a href="/admin_users.html" class="mobile-nav-item" id="mobNavAdminUsers" style="display: none;">
                <i class="fa-solid fa-user-shield"></i>
                <span>관리자</span>
            </a>
        </div>
    </nav>

    <script>
        // 0. Auth check
        const currentUser = JSON.parse(localStorage.getItem('faithon_user'));
        if (!currentUser) {
            window.location.href = '/login.html';
        }

        // DOM Elements
        const memberListEl = document.getElementById('memberList');
        const sessionTypeEl = document.getElementById('sessionType');
        const attendDateEl = document.getElementById('attendDate');
        const areaCodeEl = document.getElementById('areaCode');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const userRoleDisplay = document.getElementById('userRoleDisplay');
        const pageSubTitle = document.getElementById('pageSubTitle');
        const areaSelectLabel = document.getElementById('areaSelectLabel');
        const navReserve = document.getElementById('navReserve');
        const navAdminUsers = document.getElementById('navAdminUsers');
        const mobNavAdminUsers = document.getElementById('mobNavAdminUsers');

        let membersData = [];

        // Calculate the last 4 valid dates up to today (excludes all future dates)
        function getRecentServiceDates(serviceType) {
            const targetDay = serviceType === 'sunday' ? 0 : 3;
            const dates = [];
            const now = new Date();
            let curr = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            while (dates.length < 4) {
                if (curr.getDay() === targetDay) {
                    const yyyy = curr.getFullYear();
                    const mm = String(curr.getMonth() + 1).padStart(2, '0');
                    const dd = String(curr.getDate()).padStart(2, '0');
                    const iso = `${yyyy}-${mm}-${dd}`;
                    
                    const month = curr.getMonth() + 1;
                    const day = curr.getDate();
                    const dayName = serviceType === 'sunday' ? '주일' : '수요';
                    const label = `${yyyy}년 ${month}월 ${day}일 (${dayName})`;
                    
                    dates.push({ value: iso, label });
                }
                curr.setDate(curr.getDate() - 1);
            }
            return dates;
        }

        // Update the date dropdown based on selected 출석유형
        function updateDateOptions() {
            const type = sessionTypeEl.value;
            const dates = getRecentServiceDates(type);
            const currentSelected = attendDateEl.value;

            attendDateEl.innerHTML = '';
            dates.forEach((d, idx) => {
                const opt = document.createElement('option');
                opt.value = d.value;
                opt.textContent = d.label;
                if (idx === 0) opt.selected = true;
                attendDateEl.appendChild(opt);
            });
        }

        // Initialize User Info & Area Options based on Role
        async function initPage() {
            if (!currentUser) return;

            // 1. Check admin vs officer for Sidebar menu visibility
            const isAdmin = currentUser.role === 'admin' || currentUser.scope_type === 'all';
            if (navReserve) {
                navReserve.style.display = isAdmin ? 'flex' : 'none';
            }
            if (navAdminUsers) {
                navAdminUsers.style.display = isAdmin ? 'flex' : 'none';
            }
            if (mobNavAdminUsers) {
                mobNavAdminUsers.style.display = isAdmin ? 'flex' : 'none';
            }

            // Display user info in sidebar & mobile header
            userNameDisplay.textContent = `${currentUser.name} (${currentUser.position || '성도'})`;
            const userArea = currentUser.scope_code || currentUser.area_code || '11';
            document.getElementById('mobileUserDisplay').textContent = isAdmin ? '총괄 관리자' : `${userArea}구역`;
            
            if (isAdmin) {
                userRoleDisplay.textContent = '총괄 관리자 권한 (전체 구역)';
                pageSubTitle.innerHTML = `<span class="badge" style="background: rgba(245, 158, 11, 0.15); color: #b45309; border: 1px solid rgba(245, 158, 11, 0.3); font-weight: 700; margin-right: 6px;">관리자 조회 전용</span> 전체 구역 성도 출석을 실시간 조회합니다. (출석 체크 수정은 각 구역 담당자만 가능)`;
                areaSelectLabel.innerHTML = `구역 선택 <span class="badge badge-info" style="font-size:0.75rem;">관리자 전체 조회</span>`;
                await loadAllAreas();
            } else {
                userRoleDisplay.textContent = `${userArea}구역 담당 임원`;
                pageSubTitle.innerHTML = `<strong>${userArea}구역</strong> 성도 및 새참자 출석을 확인하세요. (클릭 시 실시간 자동 저장)`;
                areaSelectLabel.innerHTML = `담당 구역 <span class="badge badge-success" style="font-size:0.75rem;">권한 고정</span>`;
                
                // Only populate their assigned area and lock
                areaCodeEl.innerHTML = `<option value="${userArea}">${userArea}구역</option>`;
                areaCodeEl.disabled = true;
            }

            // Populate recent 4 dates
            updateDateOptions();

            // Event Listeners
            sessionTypeEl.addEventListener('change', () => {
                updateDateOptions();
                fetchMembersAndAttendance();
            });
            attendDateEl.addEventListener('change', fetchMembersAndAttendance);
            areaCodeEl.addEventListener('change', fetchMembersAndAttendance);

            // Fetch initial data
            await fetchMembersAndAttendance();
        }

        // Load all available areas from DB for Admins
        async function loadAllAreas() {
            try {
                const res = await fetch('/api/areas');
                const json = await res.json();
                if (json.success && json.data) {
                    areaCodeEl.innerHTML = '';
                    json.data.forEach(area => {
                        const opt = document.createElement('option');
                        opt.value = area;
                        opt.textContent = `${area}구역`;
                        areaCodeEl.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error("Areas load error:", err);
            }
        }

        async function fetchMembersAndAttendance() {
            const areaCode = areaCodeEl.value;
            const date = attendDateEl.value;
            const type = sessionTypeEl.value;

            if (!areaCode || !date) return;

            memberListEl.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 2rem; color: var(--text-secondary);"><i class="fa-solid fa-spinner fa-spin"></i> 성도 명단을 불러오는 중...</td></tr>';

            try {
                // 1. Fetch Members in Area (includes newcomers)
                const membersRes = await fetch(`/api/members?areaCode=${encodeURIComponent(areaCode)}`);
                const membersJson = await membersRes.json();
                if (!membersJson.success) throw new Error(membersJson.error);
                
                // 2. Fetch Attendance for specific date and type
                const attendRes = await fetch(`/api/attendance?areaCode=${encodeURIComponent(areaCode)}&date=${encodeURIComponent(date)}&type=${encodeURIComponent(type)}`);
                const attendJson = await attendRes.json();
                if (!attendJson.success) throw new Error(attendJson.error);
                
                const attendedCodes = attendJson.data || [];
                
                membersData = (membersJson.data || []).map(m => ({
                    ...m,
                    checked: attendedCodes.includes(m.CODE_NO)
                }));
                
                renderMembers();
            } catch (err) {
                console.error("Data load error:", err);
                memberListEl.innerHTML = `<tr><td colspan="3" style="text-align:center; color: var(--danger-color); padding: 1.5rem;">데이터를 불러오는 중 오류가 발생했습니다. (${err.message})</td></tr>`;
            }
        }

        function renderMembers() {
            memberListEl.innerHTML = '';
            
            if (membersData.length === 0) {
                memberListEl.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 2rem; color: var(--text-secondary);">해당 구역에 등록된 성도가 없습니다.</td></tr>';
                return;
            }
            
            const isAdmin = currentUser.role === 'admin' || currentUser.scope_type === 'all';

            membersData.forEach((member, index) => {
                const tr = document.createElement('tr');
                const pos = (member.POSITION || '').trim();
                const isNewcomer = !!member.is_newcomer;
                const isLeader = pos.includes('구역장') || pos.includes('조장') || pos.includes('부구역장') || pos.includes('조총무') || pos.includes('서기');
                
                let badgeHtml = '';
                if (isNewcomer) {
                    badgeHtml = `<span class="badge" style="background: rgba(6, 182, 212, 0.1); color: #0891b2; border: 1px solid rgba(6, 182, 212, 0.3); font-weight: 700; padding: 0.2rem 0.5rem;">새참자</span>`;
                } else if (isLeader) {
                    badgeHtml = `<span class="badge badge-success" style="padding: 0.2rem 0.5rem;">${member.POSITION}</span>`;
                } else if (pos && pos !== '성도') {
                    badgeHtml = `<span class="badge" style="background: var(--surface-hover); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 0.2rem 0.5rem;">${pos}</span>`;
                } else {
                    badgeHtml = ''; // '성도'는 뱃지 미표시
                }

                const initial = (member.NAME || '성').charAt(0);
                const avatarBg = isNewcomer ? 'background: rgba(6, 182, 212, 0.15); color: #0891b2;' : '';
                
                const disabledAttr = isAdmin ? 'disabled' : '';
                const btnCursorStyle = isAdmin ? 'cursor: not-allowed; opacity: 0.85;' : '';
                const btnTitle = isAdmin ? '관리자는 조회만 가능하며 출석 체크를 수정할 수 없습니다.' : '';

                tr.innerHTML = `
                    <td style="color: var(--text-secondary); text-align: center; font-weight: 600;">${index + 1}</td>
                    <td>
                        <div class="user-info" style="gap: 0.75rem;">
                            <div class="avatar" style="${avatarBg}">${initial}</div>
                            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                                <span style="font-weight: 700; font-size: 1.05rem; color: var(--text-primary);">
                                    ${member.NAME}
                                </span>
                                ${badgeHtml}
                                ${isNewcomer ? `<span style="font-size:0.8rem; color:var(--text-secondary); margin-left: 2px;">(인도: ${member.guide_name || '-'})</span>` : ''}
                            </div>
                        </div>
                    </td>
                    <td style="text-align: center;">
                        <label class="attend-btn-container" style="${btnCursorStyle}" title="${btnTitle}">
                            <input type="checkbox" ${member.checked ? 'checked' : ''} ${disabledAttr} onchange="toggleCheck('${member.CODE_NO}', this.checked)">
                            <div class="attend-btn-pill">
                                <span class="btn-label-unchecked"><i class="fa-regular fa-circle" style="font-size: 0.75rem;"></i> 미출석</span>
                                <span class="btn-label-checked"><i class="fa-solid fa-circle-check"></i> 출석</span>
                            </div>
                        </label>
                    </td>
                `;
                memberListEl.appendChild(tr);
            });
        }

        // 실시간 출석 체크 즉시 저장
        async function toggleCheck(codeNo, isChecked) {
            const isAdmin = currentUser.role === 'admin' || currentUser.scope_type === 'all';
            if (isAdmin) {
                alert('관리자는 구역 출석을 조회만 할 수 있으며, 출석 체크 수정 권한이 없습니다.');
                fetchMembersAndAttendance(); // Re-render to revert any accidental client toggle
                return;
            }

            const member = membersData.find(m => m.CODE_NO === codeNo);
            if (member) member.checked = isChecked;

            const date = attendDateEl.value;
            const type = sessionTypeEl.value;
            const indicator = document.getElementById('saveStatusIndicator');

            if (indicator) {
                indicator.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="color: var(--accent-color);"></i> 저장 중...';
                indicator.style.color = 'var(--text-primary)';
            }

            try {
                const res = await fetch('/api/attendance/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        date,
                        type,
                        member_code: codeNo,
                        is_attended: isChecked
                    })
                });
                const json = await res.json();
                if (!json.success) throw new Error(json.error);

                if (indicator) {
                    indicator.innerHTML = '<i class="fa-solid fa-check" style="color: var(--success-color);"></i> 실시간 자동 저장됨';
                    indicator.style.color = 'var(--success-color)';
                }
            } catch (err) {
                console.error("Auto-save toggle error:", err);
                if (indicator) {
                    indicator.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color: var(--danger-color);"></i> 저장 실패';
                    indicator.style.color = 'var(--danger-color)';
                }
            }
        }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('faithon_user');
                window.location.href = '/login.html';
            }
        }

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
