<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드 | FaithOn</title>
    <meta name="description" content="창원교회 출석체크 관리 대시보드">
    <link rel="stylesheet" href="/css/style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-church"></i>
                </div>
                <div class="brand-text">FaithOn</div>
            </div>
            <nav class="nav-menu">
                <a href="/" class="nav-item active">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>대시보드</span>
                </a>
                <a href="/attend.html" class="nav-item">
                    <i class="fa-solid fa-clipboard-user"></i>
                    <span>출석체크</span>
                </a>
                <a href="/reserve.html" class="nav-item" id="navReserve">
                    <i class="fa-solid fa-users-slash"></i>
                    <span>예비명단 관리</span>
                </a>
                <a href="/newcomer.html" class="nav-item">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>새참자 관리</span>
                </a>
            </nav>

            <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
                <div id="userProfile" style="font-size: 0.85rem; margin-bottom: 0.75rem;">
                    <div style="font-weight: 600; color: var(--text-primary);" id="userNameDisplay">접속자 정보</div>
                    <div style="color: var(--text-secondary); font-size: 0.8rem;" id="userRoleDisplay">확인 중...</div>
                </div>
                <button class="btn btn-outline" style="width: 100%; font-size: 0.8rem; padding: 0.4rem;" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> 로그아웃
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">출석 통계 대시보드</h1>
                    <p class="page-subtitle">창원교회 전체 및 구역별 출석 현황을 한눈에 파악하세요.</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-outline">
                        <i class="fa-solid fa-calendar-days"></i> 기간 설정
                    </button>
                    <button class="btn btn-primary">
                        <i class="fa-solid fa-filter"></i> 구역 설정
                    </button>
                </div>
            </div>

            <!-- Stats Overview -->
            <div class="stats-grid">
                <div class="card stat-card">
                    <span class="stat-title">금주 주일 출석</span>
                    <span class="stat-value">1,248</span>
                    <span class="stat-desc"><i class="fa-solid fa-arrow-trend-up"></i> 지난주 대비 +5.2%</span>
                </div>
                <div class="card stat-card">
                    <span class="stat-title">금주 수요 출석</span>
                    <span class="stat-value">856</span>
                    <span class="stat-desc"><i class="fa-solid fa-arrow-trend-up"></i> 지난주 대비 +2.1%</span>
                </div>
                <div class="card stat-card">
                    <span class="stat-title">새참자 (이번 달)</span>
                    <span class="stat-value">12</span>
                    <span class="stat-desc badge badge-success" style="width:fit-content; margin-top:5px;">안정화 진행중</span>
                </div>
                <div class="card stat-card">
                    <span class="stat-title">예비명단 누적</span>
                    <span class="stat-value">45</span>
                    <span class="stat-desc" style="color:var(--text-secondary)">지속 관리 필요</span>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="charts-grid">
                <div class="card chart-container">
                    <h3>주간 출석 트렌드 (최근 4주)</h3>
                    <div class="chart-wrapper">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
                <div class="card chart-container">
                    <h3>출석 비율</h3>
                    <div class="chart-wrapper">
                        <canvas id="ratioChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Chart Logic & Auth -->
    <script>
        // Auth check
        const currentUser = JSON.parse(localStorage.getItem('faithon_user'));
        if (!currentUser) {
            window.location.href = '/login.html';
        } else {
            const isAdmin = currentUser.role === 'admin' || currentUser.scope_type === 'all';
            const navReserve = document.getElementById('navReserve');
            if (navReserve) {
                navReserve.style.display = isAdmin ? 'flex' : 'none';
            }

            document.getElementById('userNameDisplay').textContent = `${currentUser.name} (${currentUser.position || '성도'})`;
            document.getElementById('userRoleDisplay').textContent = isAdmin ? '총괄 관리자' : `${currentUser.scope_code || currentUser.area_code || ''}구역 담당`;
        }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('faithon_user');
                window.location.href = '/login.html';
            }
        }

        // Chart configuration with clean corporate theme styling
        Chart.defaults.color = '#6c757d';
        Chart.defaults.font.family = "'Inter', sans-serif";
        
        // Trend Chart (Line)
        const trendCtx = document.getElementById('trendChart').getContext('2d');
        
        // Gradient for line
        const gradientBlue = trendCtx.createLinearGradient(0, 0, 0, 300);
        gradientBlue.addColorStop(0, 'rgba(20, 40, 160, 0.15)');
        gradientBlue.addColorStop(1, 'rgba(20, 40, 160, 0.0)');

        const gradientNavy = trendCtx.createLinearGradient(0, 0, 0, 300);
        gradientNavy.addColorStop(0, 'rgba(74, 108, 247, 0.15)');
        gradientNavy.addColorStop(1, 'rgba(74, 108, 247, 0.0)');

        new Chart(trendCtx, {
            type: 'line',
            data: {
                labels: ['8월 2일', '8월 9일', '8월 16일', '8월 23일'],
                datasets: [
                    {
                        label: '주일말씀 출석',
                        data: [1200, 1220, 1180, 1248],
                        borderColor: '#1428A0',
                        backgroundColor: gradientBlue,
                        borderWidth: 2.5,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#1428A0',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        fill: true,
                        tension: 0.35
                    },
                    {
                        label: '수요말씀 출석',
                        data: [810, 830, 840, 856],
                        borderColor: '#4a6cf7',
                        backgroundColor: gradientNavy,
                        borderWidth: 2.5,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#4a6cf7',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        fill: true,
                        tension: 0.35
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: { usePointStyle: true, boxWidth: 8, font: { size: 12 } }
                    },
                    tooltip: {
                        backgroundColor: '#1e293b',
                        titleColor: '#fff',
                        bodyColor: '#e2e8f0',
                        padding: 10,
                        cornerRadius: 6
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        grid: { color: '#e9ecef' },
                        border: { display: false }
                    },
                    x: {
                        grid: { display: false },
                        border: { display: false }
                    }
                }
            }
        });

        // Ratio Chart (Doughnut)
        const ratioCtx = document.getElementById('ratioChart').getContext('2d');
        new Chart(ratioCtx, {
            type: 'doughnut',
            data: {
                labels: ['출석', '예비명단', '미출석'],
                datasets: [{
                    data: [75, 5, 20],
                    backgroundColor: ['#1428A0', '#e07a00', '#dee2e6'],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '72%',
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { usePointStyle: true, padding: 16, font: { size: 12 } }
                    }
                }
            }
        });
    </script>
</body>
</html>
