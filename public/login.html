<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | 창원교회 출석부</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="창원교회 출석부">
    <meta name="application-name" content="창원교회 출석부">
    <meta name="theme-color" content="#1428A0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            margin: 0;
            padding: 1.5rem;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        .login-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 12px 30px -5px rgba(20, 40, 160, 0.12), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            box-sizing: border-box;
            position: relative;
        }
        
        .brand-img {
            width: 200px;
            max-width: 85%;
            height: auto;
            max-height: 200px;
            object-fit: contain;
            margin: 0 auto 0.75rem auto;
            display: block;
        }
        
        .login-title {
            display: none; /* logo-full.png에 이미 선명한 FaithOn 타이포가 포함되어 중복 방지 */
        }
        
        .login-subtitle {
            color: var(--text-secondary);
            margin-bottom: 1.8rem;
            font-size: 0.95rem;
            font-weight: 600;
        }
        
        .login-form {
            text-align: left;
        }
        
        .form-group {
            margin-bottom: 1.2rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.45rem;
            color: var(--text-primary);
            font-size: 0.88rem;
            font-weight: 600;
        }
        
        .input-with-icon {
            position: relative;
        }
        
        .input-with-icon > i.icon-prefix {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-color);
            font-size: 1rem;
            pointer-events: none;
        }
        
        .input-with-icon input {
            width: 100%;
            padding: 0.85rem 2.6rem 0.85rem 2.6rem;
            border-radius: 10px;
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            color: var(--text-primary);
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        
        .input-with-icon input:focus {
            background: #ffffff;
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(20, 40, 160, 0.15);
        }

        .toggle-pw-btn {
            position: absolute;
            right: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 0.25rem;
            font-size: 0.95rem;
        }
        .toggle-pw-btn:hover {
            color: var(--accent-color);
        }
        
        .btn-block {
            width: 100%;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            margin-top: 0.75rem;
            box-shadow: 0 4px 12px rgba(20, 40, 160, 0.25);
            cursor: pointer;
        }

        /* Modal for Admin Password Change */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            z-index: 1000;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            text-align: left;
            animation: modalPop 0.2s ease-out;
        }

        @keyframes modalPop {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            margin-bottom: 1.25rem;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #0f172a;
            margin: 0 0 0.5rem 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-desc {
            font-size: 0.85rem;
            color: #64748b;
            line-height: 1.45;
            margin: 0;
        }

        .alert-warning-box {
            background: #fffbeb;
            border: 1px solid #fef3c7;
            border-radius: 8px;
            padding: 0.75rem 0.9rem;
            margin-bottom: 1.2rem;
            font-size: 0.82rem;
            color: #92400e;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        /* Mode Selector Segmented Tabs */
        .mode-selector-wrapper {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 1.4rem;
            display: flex;
            gap: 4px;
            border: 1px solid #e2e8f0;
        }
        .mode-btn {
            flex: 1;
            padding: 0.65rem 0.5rem;
            border: none;
            background: transparent;
            border-radius: 9px;
            font-size: 0.88rem;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .mode-btn.active-area {
            background: #ffffff;
            color: #1428A0;
            box-shadow: 0 2px 8px rgba(20, 40, 160, 0.12);
        }
        .mode-btn.active-mother {
            background: #ffffff;
            color: #be185d;
            box-shadow: 0 2px 8px rgba(190, 24, 93, 0.15);
        }
        .theme-mother #submitBtn {
            background: linear-gradient(135deg, #be185d 0%, #9d174d 100%) !important;
            box-shadow: 0 4px 12px rgba(190, 24, 93, 0.3) !important;
        }
    </style>
</head>
<body>
    <div class="login-container" id="loginCard">
        <img src="/images/logo-full.png" alt="FaithOn Logo" class="brand-img">
        <h1 class="login-title">FaithOn</h1>
        <p class="login-subtitle" id="loginSubtitle">은혜의 자리로, 믿음 On!</p>

        <!-- 접속 모드 전환 탭 (구역 출석체크 vs 어머니회(조) 출석체크) -->
        <div class="mode-selector-wrapper">
            <button type="button" class="mode-btn active-area" id="modeAreaBtn" onclick="switchLoginMode('area')">
                <i class="fa-solid fa-people-roof"></i> 구역 출석체크
            </button>
            <button type="button" class="mode-btn" id="modeMotherBtn" onclick="switchLoginMode('mother')">
                <i class="fa-solid fa-person-dress"></i> 어머니회(조) 체크
            </button>
        </div>
        
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label class="form-label" for="phoneInput" id="phoneLabel">휴대폰 번호 또는 관리자 아이디</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-mobile-screen-button icon-prefix" id="phoneIcon"></i>
                    <input type="text" id="phoneInput" placeholder="010-0000-0000 또는 rokmc775" autofocus required autocomplete="tel">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="passwordInput" id="passwordLabel">비밀번호</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-key icon-prefix"></i>
                    <input type="password" id="passwordInput" placeholder="비밀번호 또는 구원일 8자리 입력" required autocomplete="current-password">
                    <button type="button" class="toggle-pw-btn" onclick="togglePasswordVisibility('passwordInput', this)">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- 아이디·비밀번호 저장 체크박스 (1년간 유지) -->
            <div style="display: flex; align-items: center; margin-top: 0.75rem; margin-bottom: 1.25rem;">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: #475569; cursor: pointer; user-select: none; font-weight: 500;">
                    <input type="checkbox" id="saveCredentialsCheck" style="width: 18px; height: 18px; accent-color: var(--accent-color); cursor: pointer; border-radius: 4px;">
                    <span>아이디·비밀번호 저장 (1년간 유지)</span>
                </label>
            </div>
            
            <div id="errorMsg" style="display: none; color: var(--danger-color); font-size: 0.85rem; margin-bottom: 1rem; padding: 0.6rem 0.8rem; background: rgba(220, 53, 69, 0.1); border-radius: 8px; border: 1px solid rgba(220, 53, 69, 0.2); line-height: 1.4;"></div>

            <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
                로그인
            </button>
        </form>

        <div class="login-footer" style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 1.8rem;">
            <img src="/images/church-logo.png" alt="창원교회 로고" style="width: 24px; height: 24px; object-fit: contain;">
            <span class="login-subtitle" style="margin-bottom: 0;">창원교회</span>
        </div>
    </div>

    <!-- Modal for Mandatory Admin Password Change -->
    <div id="pwChangeModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h2 class="modal-title">
                    <i class="fa-solid fa-shield-halved" style="color: var(--accent-color);"></i> 관리자 비밀번호 변경
                </h2>
                <p class="modal-desc">
                    초기 기본 비밀번호(069100)로 로그인하셨습니다.<br>
                    시스템 보안을 위해 <strong>특수문자(!@#$%^&* 등)가 1개 이상 포함된 5자리 이상의 새 비밀번호</strong>로 반드시 변경해야 로그인이 완료됩니다.
                </p>
            </div>

            <div class="alert-warning-box">
                <i class="fa-solid fa-triangle-exclamation" style="margin-top: 2px;"></i>
                <div>비밀번호를 변경하지 않으면 관리자 기능을 이용할 수 없습니다.</div>
            </div>

            <form id="pwChangeForm">
                <div class="form-group">
                    <label class="form-label" for="newPwInput">새 비밀번호 (특수문자 포함 5자리 이상)</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock icon-prefix"></i>
                        <input type="password" id="newPwInput" placeholder="특수문자 포함 5자리 이상 입력" required minlength="5">
                        <button type="button" class="toggle-pw-btn" onclick="togglePasswordVisibility('newPwInput', this)">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPwInput">새 비밀번호 확인</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-check-double icon-prefix"></i>
                        <input type="password" id="confirmPwInput" placeholder="새 비밀번호 재입력" required minlength="5">
                        <button type="button" class="toggle-pw-btn" onclick="togglePasswordVisibility('confirmPwInput', this)">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div id="modalErrorMsg" style="display: none; color: var(--danger-color); font-size: 0.82rem; margin-bottom: 1rem; padding: 0.5rem 0.75rem; background: rgba(220, 53, 69, 0.1); border-radius: 6px; border: 1px solid rgba(220, 53, 69, 0.2);"></div>

                <button type="submit" id="pwChangeBtn" class="btn btn-primary btn-block">
                    비밀번호 변경 및 로그인 완료
                </button>
            </form>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginCard = document.getElementById('loginCard');
        const phoneInput = document.getElementById('phoneInput');
        const passwordInput = document.getElementById('passwordInput');
        const saveCredentialsCheck = document.getElementById('saveCredentialsCheck');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');
        const modeAreaBtn = document.getElementById('modeAreaBtn');
        const modeMotherBtn = document.getElementById('modeMotherBtn');
        const loginSubtitle = document.getElementById('loginSubtitle');

        const pwChangeModal = document.getElementById('pwChangeModal');
        const pwChangeForm = document.getElementById('pwChangeForm');
        const newPwInput = document.getElementById('newPwInput');
        const confirmPwInput = document.getElementById('confirmPwInput');
        const modalErrorMsg = document.getElementById('modalErrorMsg');
        const pwChangeBtn = document.getElementById('pwChangeBtn');

        let currentLoginMode = localStorage.getItem('faithon_login_mode') || 'area';
        let pendingAdminUser = null;

        function switchLoginMode(mode) {
            currentLoginMode = mode;
            localStorage.setItem('faithon_login_mode', mode);

            if (mode === 'mother') {
                modeAreaBtn.className = 'mode-btn';
                modeMotherBtn.className = 'mode-btn active-mother';
                loginCard.classList.add('theme-mother');
                loginSubtitle.textContent = '어머니회(조) 사랑과 은혜 On!';
                errorMsg.style.display = 'none';
            } else {
                modeAreaBtn.className = 'mode-btn active-area';
                modeMotherBtn.className = 'mode-btn';
                loginCard.classList.remove('theme-mother');
                loginSubtitle.textContent = '은혜의 자리로, 믿음 On!';
                errorMsg.style.display = 'none';
            }
        }

        // 초기 모드 복원
        switchLoginMode(currentLoginMode);

        // Auto-redirect if already logged in (세션 1년 유효 확인)
        try {
            const savedUser = JSON.parse(localStorage.getItem('faithon_user'));
            const sessionExpires = localStorage.getItem('faithon_session_expires');
            const now = Date.now();
            if (savedUser && (!sessionExpires || now < parseInt(sessionExpires, 10))) {
                if (savedUser.login_type === 'mother') {
                    window.location.href = '/mother_attend.html';
                } else {
                    window.location.href = '/attend.html';
                }
            }
        } catch(e) {}

        // 저장된 아이디/비밀번호 자동완성 불러오기 (1년간 유지)
        try {
            const savedCreds = JSON.parse(localStorage.getItem('faithon_saved_creds'));
            if (savedCreds && savedCreds.phone) {
                const now = Date.now();
                if (!savedCreds.expiresAt || now < savedCreds.expiresAt) {
                    phoneInput.value = savedCreds.phone || '';
                    passwordInput.value = savedCreds.password || '';
                    saveCredentialsCheck.checked = true;
                } else {
                    localStorage.removeItem('faithon_saved_creds');
                }
            }
        } catch(e) {}

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-regular fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 확인 중...';

            const phone = phoneInput.value.trim();
            const password = passwordInput.value.trim();
            const isSaveChecked = saveCredentialsCheck.checked;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password, login_type: currentLoginMode })
                });

                const data = await res.json();

                if (data.success) {
                    // 아이디/비밀번호 저장 처리 (1년간 유지: 365일)
                    const oneYearMs = 365 * 24 * 60 * 60 * 1000;
                    const expiryTime = Date.now() + oneYearMs;

                    if (isSaveChecked) {
                        localStorage.setItem('faithon_saved_creds', JSON.stringify({
                            phone,
                            password,
                            savedAt: Date.now(),
                            expiresAt: expiryTime
                        }));
                        localStorage.setItem('faithon_session_expires', String(expiryTime));
                    } else {
                        localStorage.removeItem('faithon_saved_creds');
                        localStorage.removeItem('faithon_session_expires');
                    }

                    if (data.require_password_change) {
                        // 관리자 최초 비밀번호(069100) 즉시 변경 팝업 노출
                        pendingAdminUser = data.user;
                        pwChangeModal.style.display = 'flex';
                        newPwInput.focus();
                    } else if (data.user) {
                        localStorage.setItem('faithon_user', JSON.stringify(data.user));
                        const targetUrl = (data.user.login_type === 'mother') ? '/mother_attend.html' : '/attend.html';
                        window.location.href = targetUrl;
                    }
                } else {
                    errorMsg.textContent = data.error || '로그인에 실패했습니다.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                console.error('Login error:', err);
                errorMsg.textContent = '서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.';
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '로그인';
            }
        });

        // Handle Admin Password Change Form
        pwChangeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            modalErrorMsg.style.display = 'none';

            const newPw = newPwInput.value.trim();
            const confirmPw = confirmPwInput.value.trim();

            if (newPw === '069100') {
                modalErrorMsg.textContent = '초기 비밀번호(069100)와 다른 새로운 비밀번호를 입력해주세요.';
                modalErrorMsg.style.display = 'block';
                return;
            }

            if (newPw.length < 5) {
                modalErrorMsg.textContent = '비밀번호는 최소 5자리 이상이어야 합니다.';
                modalErrorMsg.style.display = 'block';
                return;
            }

            const specialCharRegex = /[!@#$%^&*(),.?":{}|<>_\-+=~`[\]\\;/]/;
            if (!specialCharRegex.test(newPw)) {
                modalErrorMsg.textContent = '비밀번호에 특수문자(!@#$%^&* 등)가 최소 1개 이상 반드시 포함되어야 합니다.';
                modalErrorMsg.style.display = 'block';
                return;
            }

            if (newPw !== confirmPw) {
                modalErrorMsg.textContent = '새 비밀번호와 비밀번호 확인이 일치하지 않습니다.';
                modalErrorMsg.style.display = 'block';
                return;
            }

            pwChangeBtn.disabled = true;
            pwChangeBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 변경 중...';

            const phone = pendingAdminUser?.phone || phoneInput.value.trim();

            try {
                const res = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, new_password: newPw })
                });

                const data = await res.json();

                if (data.success && data.user) {
                    // 원래 선택했던 login_type 복원
                    const finalUser = { ...data.user, login_type: pendingAdminUser?.login_type || currentLoginMode };
                    localStorage.setItem('faithon_user', JSON.stringify(finalUser));
                    alert('비밀번호가 성공적으로 변경되었습니다. 출석부로 이동합니다.');
                    const targetUrl = (finalUser.login_type === 'mother') ? '/mother_attend.html' : '/attend.html';
                    window.location.href = targetUrl;
                } else {
                    modalErrorMsg.textContent = data.error || '비밀번호 변경에 실패했습니다.';
                    modalErrorMsg.style.display = 'block';
                }
            } catch (err) {
                console.error('Change password error:', err);
                modalErrorMsg.textContent = '비밀번호 변경 중 오류가 발생했습니다.';
                modalErrorMsg.style.display = 'block';
            } finally {
                pwChangeBtn.disabled = false;
                pwChangeBtn.innerHTML = '비밀번호 변경 및 로그인 완료';
            }
        });
    </script>
</body>
</html>
