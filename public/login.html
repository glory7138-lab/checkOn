<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | FaithOn출첵</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/jpeg" href="/images/logo.jpg">
    <link rel="apple-touch-icon" href="/images/logo.jpg">
    <meta name="apple-mobile-web-app-title" content="FaithOn출첵">
    <meta name="application-name" content="FaithOn출첵">
    <meta name="theme-color" content="#1428A0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            margin: 0;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 12px 30px -5px rgba(20, 40, 160, 0.12), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            box-sizing: border-box;
        }
        
        .brand-img {
            width: 120px;
            height: auto;
            max-height: 90px;
            object-fit: contain;
            margin: 0 auto 1rem auto;
            display: block;
        }
        
        .login-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.25rem;
            color: var(--accent-color);
            letter-spacing: -0.5px;
        }
        
        .login-subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .login-form {
            text-align: left;
        }
        
        .form-group {
            margin-bottom: 1.25rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-size: 0.88rem;
            font-weight: 600;
        }
        
        .input-with-icon {
            position: relative;
        }
        
        .input-with-icon i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-color);
            font-size: 1rem;
        }
        
        .input-with-icon input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.6rem;
            border-radius: 10px;
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            color: var(--text-primary);
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        
        .input-with-icon input:focus {
            background: #ffffff;
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(20, 40, 160, 0.15);
        }
        
        .btn-block {
            width: 100%;
            padding: 0.85rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            margin-top: 0.75rem;
            box-shadow: 0 4px 12px rgba(20, 40, 160, 0.25);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="/images/logo.jpg" alt="FaithOn Logo" class="brand-img">
        <h1 class="login-title">FaithOn</h1>
        <p class="login-subtitle">창원교회 출석체크 관리 시스템</p>
        
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label class="form-label">휴대폰 번호</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                    <input type="tel" id="phoneInput" placeholder="010-0000-0000" autofocus required>
                </div>
                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.5rem;">
                    * 구역임원 또는 관리자로 등록된 휴대폰 번호를 입력하세요.
                </p>
            </div>
            
            <div id="errorMsg" style="display: none; color: var(--danger-color); font-size: 0.85rem; margin-bottom: 1rem; padding: 0.5rem; background: rgba(220, 53, 69, 0.1); border-radius: 6px; border: 1px solid rgba(220, 53, 69, 0.2);"></div>

            <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
                로그인 및 권한 확인
            </button>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const phoneInput = document.getElementById('phoneInput');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');

        // 이미 로그인되어 있으면 출석체크현황(/attend.html)으로 바로 이동
        try {
            const savedUser = JSON.parse(localStorage.getItem('faithon_user'));
            if (savedUser) {
                window.location.href = '/attend.html';
            }
        } catch(e) {}

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 확인 중...';

            const phone = phoneInput.value.trim();

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });

                const data = await res.json();

                if (data.success && data.user) {
                    // 사용자 정보 저장
                    localStorage.setItem('faithon_user', JSON.stringify(data.user));
                    // 관리자와 구역임원 모두 첫화면은 출석체크현황(attend.html)으로 이동
                    window.location.href = '/attend.html';
                } else {
                    errorMsg.textContent = data.error || '로그인에 실패했습니다.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                console.error('Login error:', err);
                errorMsg.textContent = '서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.';
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '로그인 및 권한 확인';
            }
        });
    </script>
</body>
</html>
