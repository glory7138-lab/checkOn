<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새참자 관리 | FaithOn</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-header-actions {
            display: flex;
            gap: 1rem;
        }
        
        .newcomer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        
        .newcomer-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            transition: var(--transition-normal);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        
        .newcomer-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: var(--shadow-md);
        }
        
        .newcomer-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-color);
        }
        
        .nc-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }
        
        .nc-name {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
        }
        
        .nc-date {
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: var(--bg-color);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
        }
        
        .nc-info {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        
        .nc-info-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .nc-info-row i {
            width: 16px;
            text-align: center;
            color: var(--accent-color);
        }
        
        .nc-actions {
            display: flex;
            gap: 0.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }
        
        .nc-actions .btn {
            flex: 1;
            padding: 0.5rem;
            font-size: 0.85rem;
        }
        
        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-normal);
        }
        
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .modal-content {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            transform: translateY(20px);
            transition: var(--transition-normal);
            box-shadow: var(--shadow-lg);
        }
        
        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .close-btn {
            color: var(--text-secondary);
            font-size: 1.5rem;
        }
        
        .close-btn:hover {
            color: var(--text-primary);
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-church"></i>
                </div>
                <div class="brand-text">FaithOn</div>
            </div>
            <nav class="nav-menu">
                <a href="/" class="nav-item">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>대시보드</span>
                </a>
                <a href="/attend.html" class="nav-item">
                    <i class="fa-solid fa-clipboard-user"></i>
                    <span>출석체크</span>
                </a>
                <a href="/reserve.html" class="nav-item">
                    <i class="fa-solid fa-users-slash"></i>
                    <span>예비명단 관리</span>
                </a>
                <a href="/newcomer.html" class="nav-item active">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>새참자 관리</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">새참자 관리</h1>
                    <p class="page-subtitle">새로 오신 분들을 등록하고 관리합니다.</p>
                </div>
                <div class="page-header-actions">
                    <button class="btn btn-primary" onclick="openModal()">
                        <i class="fa-solid fa-plus"></i> 새참자 등록
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="search-box" style="position: relative; margin-bottom: 1rem;">
                    <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"></i>
                    <input type="text" class="form-input" style="padding-left: 2.5rem;" placeholder="이름으로 새참자 검색...">
                </div>

                <div class="newcomer-grid">
                    <!-- Card 1 -->
                    <div class="newcomer-card">
                        <div class="nc-header">
                            <div class="nc-name">
                                홍길동 <span class="badge badge-success" style="font-size: 0.7rem;">신규</span>
                            </div>
                            <div class="nc-date">26.08.15 등록</div>
                        </div>
                        <div class="nc-info">
                            <div class="nc-info-row">
                                <i class="fa-solid fa-phone"></i> 010-1234-5678
                            </div>
                            <div class="nc-info-row">
                                <i class="fa-solid fa-map-location-dot"></i> 임시 편성: 11구역
                            </div>
                            <div class="nc-info-row">
                                <i class="fa-solid fa-clipboard-check"></i> 누적 출석: 2회
                            </div>
                        </div>
                        <div class="nc-actions">
                            <button class="btn btn-outline" style="border-color: rgba(255,255,255,0.1); color: white;">수정</button>
                            <button class="btn btn-outline" style="border-color: var(--success-color); color: var(--success-color);">
                                <i class="fa-solid fa-check"></i> 정식 구역 이동
                            </button>
                        </div>
                    </div>

                    <!-- Card 2 -->
                    <div class="newcomer-card" style="border-left-color: var(--warning-color);">
                        <div class="nc-header">
                            <div class="nc-name">
                                장보고 <span class="badge" style="background: rgba(245, 158, 11, 0.15); color: var(--warning-color); border: 1px solid rgba(245, 158, 11, 0.3); font-size: 0.7rem;">3주차</span>
                            </div>
                            <div class="nc-date">26.08.01 등록</div>
                        </div>
                        <div class="nc-info">
                            <div class="nc-info-row">
                                <i class="fa-solid fa-phone"></i> 010-9876-5432
                            </div>
                            <div class="nc-info-row">
                                <i class="fa-solid fa-map-location-dot"></i> 임시 편성: 21구역
                            </div>
                            <div class="nc-info-row">
                                <i class="fa-solid fa-clipboard-check"></i> 누적 출석: 3회
                            </div>
                        </div>
                        <div class="nc-actions">
                            <button class="btn btn-outline" style="border-color: rgba(255,255,255,0.1); color: white;">수정</button>
                            <button class="btn btn-outline" style="border-color: var(--success-color); color: var(--success-color);">
                                <i class="fa-solid fa-check"></i> 정식 구역 이동
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for adding newcomer -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">새참자 등록</h2>
                <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">이름</label>
                    <input type="text" class="form-input" placeholder="이름 입력">
                </div>
                <div class="form-group">
                    <label class="form-label">연락처</label>
                    <input type="text" class="form-input" placeholder="010-0000-0000">
                </div>
                <div class="form-group">
                    <label class="form-label">임시 편성 구역</label>
                    <select class="form-input">
                        <option>선택...</option>
                        <option>11구역</option>
                        <option>12구역</option>
                    </select>
                </div>
                <button class="btn btn-primary" style="width: 100%; margin-top: 1rem;" onclick="closeModal()">
                    등록하기
                </button>
            </div>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('addModal').classList.add('active');
        }
        function closeModal() {
            document.getElementById('addModal').classList.remove('active');
        }
    </script>
</body>
</html>
