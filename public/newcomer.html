<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새참자 관리 | FaithOn출첵</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/jpeg" href="/images/logo.jpg">
    <link rel="apple-touch-icon" href="/images/logo.jpg">
    <meta name="apple-mobile-web-app-title" content="FaithOn출첵">
    <meta name="application-name" content="FaithOn출첵">
    <meta name="theme-color" content="#1428A0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-header-actions {
            display: flex;
            gap: 1rem;
        }
        
        .newcomer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        
        .newcomer-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            transition: var(--transition-normal);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        
        .newcomer-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: var(--shadow-md);
        }
        
        .newcomer-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-color);
        }
        
        .nc-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }
        
        .nc-name {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
        }
        
        .nc-date {
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: var(--bg-color);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
        }
        
        .nc-info {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        
        .nc-info-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .nc-info-row i {
            width: 16px;
            text-align: center;
            color: var(--accent-color);
        }
        
        .nc-actions {
            display: flex;
            gap: 0.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }
        
        .nc-actions .btn {
            flex: 1;
            padding: 0.5rem;
            font-size: 0.85rem;
        }
        
        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-normal);
        }
        
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .modal-content {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            transform: translateY(20px);
            transition: var(--transition-normal);
            box-shadow: var(--shadow-lg);
        }
        
        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .close-btn {
            color: var(--text-secondary);
            font-size: 1.5rem;
        }
        
        .close-btn:hover {
            color: var(--text-primary);
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: inherit;
        }

        /* Mobile Newcomer List: 가로 스크롤 없이 4개 항목 높이(약 250px)로 세로 스크롤 */
        @media (max-width: 768px) {
            .table-container {
                overflow-x: hidden !important;
                max-height: 250px !important;
                overflow-y: auto !important;
                -webkit-overflow-scrolling: touch;
                border: 1px solid var(--border-color);
                border-radius: 8px;
            }
            .data-table {
                width: 100% !important;
                table-layout: fixed;
            }
            .data-table th.col-hide-mobile,
            .data-table td.col-hide-mobile {
                display: none !important;
            }
            .nc-main-cell {
                padding: 0.7rem 0.5rem !important;
            }
            .nc-row-line1 {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-wrap: nowrap;
            }
            .nc-row-line2 {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-top: 4px;
                font-size: 0.78rem;
                color: var(--text-secondary);
            }
        }
    </style>
</head>
<body>
    <!-- Mobile Top Bar with Quick Navigation -->
    <header class="mobile-top-bar" style="flex-direction: column; gap: 0.5rem; padding: 0.65rem 0.85rem;">
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <div class="brand-icon" style="width: 28px; height: 28px; border-radius: 6px;">
                    <img src="/images/logo.jpg" alt="FaithOn" class="brand-img-logo">
                </div>
                <span style="font-weight: 800; color: var(--accent-color); font-size: 1.1rem;">FaithOn</span>
            </div>
            <div style="display: flex; align-items: center; gap: 0.6rem;">
                <span id="mobileUserDisplay" style="font-size: 0.8rem; font-weight: 700; color: var(--accent-color); background: var(--accent-light); padding: 3px 8px; border-radius: 6px;">31구역</span>
                <button onclick="logout()" style="color: var(--danger-color); font-size: 0.9rem; padding: 4px;" title="로그아웃">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
        
        <!-- Mobile Quick Menu Pills -->
        <nav class="mobile-quick-nav" id="mobileQuickNav" aria-label="모바일 메뉴">
            <!-- Dynamically populated in initPage() based on role -->
        </nav>
    </header>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <img src="/images/logo.jpg" alt="FaithOn" class="brand-img-logo">
                </div>
                <div class="brand-text">FaithOn</div>
            </div>
            <nav class="nav-menu">
                <a href="/" class="nav-item" id="navDashboard">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>대시보드</span>
                </a>
                <a href="/attend.html" class="nav-item" id="navAttend" style="display: none;">
                    <i class="fa-solid fa-clipboard-user"></i>
                    <span>출석체크</span>
                </a>
                <a href="/newcomer.html" class="nav-item active" id="navNewcomer">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>새참자 관리</span>
                </a>
                <a href="/reserve.html" class="nav-item" id="navReserve" style="display: none;">
                    <i class="fa-solid fa-users-slash"></i>
                    <span>예비명단 관리</span>
                </a>
                <a href="/admin_users.html" class="nav-item" id="navAdminUsers" style="display: none;">
                    <i class="fa-solid fa-user-shield"></i>
                    <span>관리자 설정</span>
                </a>
            </nav>

            <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
                <div id="userProfile" style="font-size: 0.85rem; margin-bottom: 0.75rem;">
                    <div style="font-weight: 600; color: var(--text-primary);" id="userNameDisplay">접속자 정보</div>
                    <div style="color: var(--text-secondary); font-size: 0.8rem;" id="userRoleDisplay">확인 중...</div>
                </div>
                <button class="btn btn-outline" style="width: 100%; font-size: 0.8rem; padding: 0.4rem;" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> 로그아웃
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">새참자 관리</h1>
                    <p class="page-subtitle" id="pageSubTitle">구역에 새로 오신 분들을 등록하고 출석을 관리합니다.</p>
                </div>
                <div class="page-header-actions">
                    <button class="btn btn-primary" onclick="openAddModal()">
                        <i class="fa-solid fa-plus"></i> 새참자 등록
                    </button>
                </div>
            </div>

            <!-- Notice Banner -->
            <div style="background: rgba(20, 40, 160, 0.05); border: 1px solid rgba(20, 40, 160, 0.2); border-radius: 8px; padding: 0.85rem 1.25rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
                <i class="fa-solid fa-circle-info" style="color: var(--accent-color); font-size: 1.1rem;"></i>
                <div style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.4;">
                    <strong>안내:</strong> 등록된 새참자는 [출석체크] 화면에서 함께 출석을 체크할 수 있습니다. 
                    향후 주소록 관리자가 본인 구역에 정식 등록을 완료하면 새참자 명단에서 <strong>자동으로 정리(삭제)</strong>됩니다.
                </div>
            </div>

            <div class="card">
                <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center;">
                    <div style="flex: 1; min-width: 220px; position: relative;">
                        <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"></i>
                        <input type="text" class="form-input" id="searchInput" style="padding-left: 2.5rem;" placeholder="이름 또는 인도자로 검색...">
                    </div>
                    <div style="width: 180px;" id="areaFilterContainer">
                        <select class="form-input" id="areaFilter">
                            <!-- JS Will Render -->
                        </select>
                    </div>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 42px; text-align: center;">순번</th>
                                <th>새참자 & 인도자 정보</th>
                                <th class="col-hide-mobile" style="width: 110px;">인도자</th>
                                <th class="col-hide-mobile" style="width: 90px;">배정 구역</th>
                                <th class="col-hide-mobile" style="text-align: center; width: 85px;">누적 출석</th>
                                <th class="col-hide-mobile" style="width: 110px;">등록일자</th>
                                <th style="text-align: center; width: 75px;">관리</th>
                            </tr>
                        </thead>
                        <tbody id="newcomerList">
                            <!-- Rows will render here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav">
        <div class="mobile-bottom-nav-inner">
            <a href="/" class="mobile-nav-item">
                <i class="fa-solid fa-chart-pie"></i>
                <span>대시보드</span>
            </a>
            <a href="/attend.html" class="mobile-nav-item" id="mobNavAttend">
                <i class="fa-solid fa-clipboard-user"></i>
                <span>출석체크</span>
            </a>
            <a href="/newcomer.html" class="mobile-nav-item active">
                <i class="fa-solid fa-user-plus"></i>
                <span>새참자</span>
            </a>
            <a href="/reserve.html" class="mobile-nav-item" id="mobNavReserve" style="display: none;">
                <i class="fa-solid fa-users-slash"></i>
                <span>예비명단</span>
            </a>
            <a href="/admin_users.html" class="mobile-nav-item" id="mobNavAdminUsers" style="display: none;">
                <i class="fa-solid fa-user-shield"></i>
                <span>관리자</span>
            </a>
        </div>
    </nav>

    <!-- Modal for adding/editing newcomer -->
    <div class="modal-overlay" id="newcomerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">새참자 등록</h2>
                <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="newcomerForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label class="form-label">이름 <span style="color: var(--danger-color);">*</span></label>
                    <input type="text" class="form-input" id="modalName" placeholder="성명 입력" required>
                </div>
                <div class="form-group">
                    <label class="form-label">인도자 <span style="color: var(--danger-color);">*</span></label>
                    <input type="text" class="form-input" id="modalGuide" placeholder="인도자 성명 입력" required>
                </div>
                <div class="form-group">
                    <label class="form-label">연락처</label>
                    <input type="tel" class="form-input" id="modalPhone" placeholder="010-0000-0000">
                </div>
                <div class="form-group">
                    <label class="form-label">배정 구역 <span style="color: var(--danger-color);">*</span></label>
                    <select class="form-input" id="modalArea" required>
                        <!-- Options populated based on role -->
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">메모 / 특이사항</label>
                    <input type="text" class="form-input" id="modalMemo" placeholder="인도일 등 간단한 메모">
                </div>
                <div id="modalError" style="display: none; color: var(--danger-color); font-size: 0.85rem; margin-top: 0.5rem; padding: 0.5rem; background: rgba(220, 53, 69, 0.1); border-radius: 6px;"></div>
                
                <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-outline" style="flex: 1;" onclick="closeModal()">취소</button>
                    <button type="submit" class="btn btn-primary" id="saveSubmitBtn" style="flex: 1;">저장</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('faithon_user'));
        if (!currentUser) {
            window.location.href = '/login.html';
        }

        const isAdmin = currentUser.role === 'admin' || currentUser.scope_type === 'all';
        const userArea = currentUser.scope_code || currentUser.area_code || '11';

        // Elements
        const newcomerList = document.getElementById('newcomerList');
        const searchInput = document.getElementById('searchInput');
        const areaFilter = document.getElementById('areaFilter');
        const modalArea = document.getElementById('modalArea');
        const navReserve = document.getElementById('navReserve');
        const navAdminUsers = document.getElementById('navAdminUsers');
        const mobNavAdminUsers = document.getElementById('mobNavAdminUsers');

        let newcomersList = [];

        async function initPage() {
            // 1. Sidebar & Mobile nav setup
            const navAttend = document.getElementById('navAttend');
            if (navAttend) {
                navAttend.style.display = 'flex';
                const label = navAttend.querySelector('span');
                if (label) label.textContent = isAdmin ? '출석체크현황' : '출석체크';
            }

            const mobNavAttend = document.getElementById('mobNavAttend');
            if (mobNavAttend) {
                mobNavAttend.style.display = 'flex';
                const label = mobNavAttend.querySelector('span');
                if (label) label.textContent = isAdmin ? '출석체크현황' : '출석체크';
            }

            const mobNavReserve = document.getElementById('mobNavReserve');
            if (navReserve) {
                navReserve.style.display = isAdmin ? 'flex' : 'none';
            }
            if (navAdminUsers) {
                navAdminUsers.style.display = isAdmin ? 'flex' : 'none';
            }
            if (mobNavReserve) {
                mobNavReserve.style.display = isAdmin ? 'flex' : 'none';
            }
            if (mobNavAdminUsers) {
                mobNavAdminUsers.style.display = isAdmin ? 'flex' : 'none';
            }

            // Render Mobile Quick Top Menu dynamically
            const quickNav = document.getElementById('mobileQuickNav');
            if (quickNav) {
                if (isAdmin) {
                    quickNav.innerHTML = `
                        <a href="/?view=dashboard" class="mobile-quick-item"><i class="fa-solid fa-chart-pie"></i> 통계</a>
                        <a href="/attend.html" class="mobile-quick-item"><i class="fa-solid fa-clipboard-user"></i> 출석체크현황</a>
                        <a href="/newcomer.html" class="mobile-quick-item active"><i class="fa-solid fa-user-plus"></i> 새참자</a>
                        <a href="/reserve.html" class="mobile-quick-item"><i class="fa-solid fa-users-slash"></i> 예비명단</a>
                        <a href="/admin_users.html" class="mobile-quick-item"><i class="fa-solid fa-user-shield"></i> 관리자</a>
                    `;
                } else {
                    quickNav.innerHTML = `
                        <a href="/attend.html" class="mobile-quick-item"><i class="fa-solid fa-clipboard-user"></i> 출석체크</a>
                        <a href="/newcomer.html" class="mobile-quick-item active"><i class="fa-solid fa-user-plus"></i> 새참자</a>
                        <a href="/?view=dashboard" class="mobile-quick-item"><i class="fa-solid fa-chart-pie"></i> 통계</a>
                    `;
                }
            }
            document.getElementById('userNameDisplay').textContent = `${currentUser.name} (${currentUser.position || '성도'})`;
            document.getElementById('mobileUserDisplay').textContent = isAdmin ? (currentUser.name || '관리자') : `${userArea}구역`;
            document.getElementById('userRoleDisplay').textContent = isAdmin ? `${currentUser.name} (${currentUser.position || '관리자'})` : `${userArea}구역 담당 임원`;

            // 2. Area Filter setup
            if (isAdmin) {
                document.getElementById('pageSubTitle').textContent = '전체 구역의 새참자 명단을 관리자 권한으로 조회 및 관리합니다.';
                await loadAllAreas();
            } else {
                document.getElementById('pageSubTitle').textContent = `${userArea}구역에 새로 오신 분들을 등록하고 관리합니다.`;
                areaFilter.innerHTML = `<option value="${userArea}">${userArea}구역</option>`;
                areaFilter.disabled = true;

                modalArea.innerHTML = `<option value="${userArea}">${userArea}구역</option>`;
                modalArea.disabled = true;
            }

            areaFilter.addEventListener('change', fetchNewcomers);
            searchInput.addEventListener('input', renderNewcomers);

            await fetchNewcomers();
        }

        async function loadAllAreas() {
            try {
                const res = await fetch('/api/areas');
                const json = await res.json();
                if (json.success && json.data) {
                    areaFilter.innerHTML = '<option value="">전체 구역</option>';
                    modalArea.innerHTML = '';
                    json.data.forEach(area => {
                        const opt = document.createElement('option');
                        opt.value = area;
                        opt.textContent = `${area}구역`;
                        areaFilter.appendChild(opt);

                        const mOpt = document.createElement('option');
                        mOpt.value = area;
                        mOpt.textContent = `${area}구역`;
                        modalArea.appendChild(mOpt);
                    });
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function fetchNewcomers() {
            const area = isAdmin ? areaFilter.value : userArea;
            newcomerList.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 2rem; color:var(--text-secondary);"><i class="fa-solid fa-spinner fa-spin"></i> 새참자 명단을 불러오는 중...</td></tr>';

            try {
                const url = area ? `/api/newcomers?areaCode=${encodeURIComponent(area)}` : '/api/newcomers';
                const res = await fetch(url);
                const json = await res.json();

                if (json.success) {
                    newcomersList = json.data || [];
                    renderNewcomers();
                } else {
                    throw new Error(json.error);
                }
            } catch (err) {
                console.error(err);
                newcomerList.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--danger-color); padding: 1.5rem;">데이터를 불러오는 중 오류가 발생했습니다. (${err.message})</td></tr>`;
            }
        }

        function renderNewcomers() {
            const query = searchInput.value.trim().toLowerCase();
            const filtered = newcomersList.filter(nc => 
                (nc.name && nc.name.toLowerCase().includes(query)) ||
                (nc.guide_name && nc.guide_name.toLowerCase().includes(query)) ||
                (nc.phone && nc.phone.includes(query)) ||
                (nc.memo && nc.memo.toLowerCase().includes(query))
            );

            newcomerList.innerHTML = '';
            if (filtered.length === 0) {
                newcomerList.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 3rem; color:var(--text-secondary);">등록된 새참자가 없습니다.</td></tr>';
                return;
            }

            filtered.forEach((nc, idx) => {
                const tr = document.createElement('tr');
                const regDate = nc.registered_at ? nc.registered_at.split('T')[0] : '';

                tr.innerHTML = `
                    <td style="color: var(--text-secondary); text-align: center; font-weight: 600; width: 42px;">${idx + 1}</td>
                    <td class="nc-main-cell">
                        <!-- 1번째 줄: 이름 + 새참자 뱃지 + 전화번호 -->
                        <div class="nc-row-line1">
                            <span style="font-weight: 700; font-size: 0.95rem; color: var(--text-primary);">${nc.name}</span>
                            <span class="badge" style="background: rgba(6, 182, 212, 0.1); color: #0891b2; border: 1px solid rgba(6, 182, 212, 0.3); font-size: 0.72rem; padding: 0.12rem 0.4rem; font-weight: 700;">새참자</span>
                            ${nc.phone ? `<span style="font-size: 0.78rem; color: var(--text-secondary); margin-left: 2px;"><i class="fa-solid fa-phone" style="font-size: 0.7rem; color: var(--accent-color);"></i> ${nc.phone}</span>` : ''}
                        </div>
                        <!-- 2번째 줄(모바일용 1회 개행): 인도자 + 구역 + 누적출석 -->
                        <div class="nc-row-line2">
                            <span><i class="fa-solid fa-user-tag" style="color: var(--accent-color); font-size: 0.72rem;"></i> 인도: <strong style="color: var(--text-primary);">${nc.guide_name || '-'}</strong></span>
                            <span style="color: #cbd5e1;">|</span>
                            <span>${nc.area_code}구역</span>
                            <span style="color: #cbd5e1;">|</span>
                            <span style="color: var(--accent-color); font-weight: 700;">출석 ${nc.attendance_count || 0}회</span>
                        </div>
                    </td>
                    <td class="col-hide-mobile" style="white-space: nowrap;">
                        <span style="font-weight: 600; font-size: 0.88rem; color: var(--text-primary);">${nc.guide_name || '-'}</span>
                    </td>
                    <td class="col-hide-mobile" style="white-space: nowrap;">
                        <span class="badge" style="background: var(--surface-hover); border: 1px solid var(--border-color); color: var(--text-primary); font-weight: 600; font-size: 0.75rem;">
                            ${nc.area_code}구역
                        </span>
                    </td>
                    <td class="col-hide-mobile" style="text-align: center; font-weight: 700; color: var(--accent-color); white-space: nowrap;">
                        ${nc.attendance_count || 0}회
                    </td>
                    <td class="col-hide-mobile" style="color: var(--text-secondary); font-size: 0.8rem; white-space: nowrap;">
                        ${regDate}
                    </td>
                    <td style="text-align: center; white-space: nowrap; width: 75px;">
                        <div style="display: inline-flex; gap: 4px; justify-content: center;">
                            <button class="btn btn-outline" style="padding: 0.3rem 0.55rem; font-size: 0.78rem;" onclick="openEditModal(${nc.id})" title="정보 수정">
                                <i class="fa-solid fa-pen"></i> 수정
                            </button>
                            ${isAdmin ? `
                            <button class="btn btn-outline" style="padding: 0.3rem 0.55rem; font-size: 0.78rem; color: var(--danger-color); border-color: rgba(220, 53, 69, 0.3);" onclick="deleteNewcomer(${nc.id}, '${nc.name}')" title="삭제">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                            ` : ''}
                        </div>
                    </td>
                `;
                newcomerList.appendChild(tr);
            });
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = '새참자 등록';
            document.getElementById('editId').value = '';
            document.getElementById('modalName').value = '';
            document.getElementById('modalGuide').value = '';
            document.getElementById('modalPhone').value = '';
            document.getElementById('modalMemo').value = '';
            document.getElementById('modalError').style.display = 'none';

            if (!isAdmin) {
                modalArea.value = userArea;
                modalArea.disabled = true;
            }

            document.getElementById('newcomerModal').classList.add('active');
        }

        function openEditModal(id) {
            const nc = newcomersList.find(n => n.id === id);
            if (!nc) return;

            document.getElementById('modalTitle').textContent = '새참자 정보 수정';
            document.getElementById('editId').value = nc.id;
            document.getElementById('modalName').value = nc.name;
            document.getElementById('modalGuide').value = nc.guide_name || '';
            document.getElementById('modalPhone').value = nc.phone || '';
            document.getElementById('modalMemo').value = nc.memo || '';
            document.getElementById('modalArea').value = nc.area_code;
            document.getElementById('modalError').style.display = 'none';

            if (!isAdmin) {
                modalArea.disabled = true;
            }

            document.getElementById('newcomerModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('newcomerModal').classList.remove('active');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const name = document.getElementById('modalName').value.trim();
            const guide_name = document.getElementById('modalGuide').value.trim();
            const phone = document.getElementById('modalPhone').value.trim();
            const area_code = document.getElementById('modalArea').value.trim();
            const memo = document.getElementById('modalMemo').value.trim();
            const errorDiv = document.getElementById('modalError');
            const submitBtn = document.getElementById('saveSubmitBtn');

            if (!name || !guide_name || !area_code) {
                errorDiv.textContent = '이름, 인도자, 배정 구역은 필수 항목입니다.';
                errorDiv.style.display = 'block';
                return;
            }

            errorDiv.style.display = 'none';
            submitBtn.disabled = true;

            const payload = {
                name,
                guide_name,
                phone,
                area_code,
                memo,
                created_by: currentUser.name
            };

            try {
                const url = editId ? `/api/newcomers/${editId}` : '/api/newcomers';
                const method = editId ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const json = await res.json();

                if (json.success) {
                    closeModal();
                    await fetchNewcomers();
                } else {
                    errorDiv.textContent = json.error || '저장 중 오류가 발생했습니다.';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                errorDiv.textContent = '서버 연결에 실패했습니다.';
                errorDiv.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
            }
        }

        async function promptMoveNewcomerArea(id, name, currentArea) {
            const nc = newcomersList.find(n => n.id === id);
            if (!nc) return;
            const newArea = prompt(`'${name}' 새참자의 이동할 구역 번호를 입력하세요:\n(현재: ${currentArea}구역, 예: 11, 12, 21, 31 등)`, currentArea);
            if (!newArea || newArea.trim() === '' || newArea.trim() === currentArea) return;

            const cleanArea = newArea.replace(/[^0-9]/g, '');
            if (!cleanArea) {
                alert('올바른 구역 번호를 입력해주세요.');
                return;
            }

            try {
                const res = await fetch(`/api/newcomers/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: nc.name,
                        guide_name: nc.guide_name,
                        phone: nc.phone,
                        area_code: cleanArea,
                        memo: nc.memo
                    })
                });
                const json = await res.json();
                if (json.success) {
                    alert(`'${name}' 새참자가 ${cleanArea}구역으로 이동되었습니다.`);
                    await fetchNewcomers();
                } else {
                    alert(json.error || '구역 이동 중 오류가 발생했습니다.');
                }
            } catch (err) {
                console.error(err);
                alert('구역 이동 처리 중 서버 오류가 발생했습니다.');
            }
        }

        async function moveNewcomerToReserve(id, name, areaCode) {
            if (!confirm(`'${name}' 새참자를 예비명단으로 이동하시겠습니까?\n(이동 시 구역 출석체크 목록에서 제외되며, 예비명단 관리에서 언제든 구역으로 복귀시킬 수 있습니다.)`)) {
                return;
            }

            try {
                const res = await fetch('/api/reserve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        member_code: `NC_${id}`,
                        original_area: areaCode,
                        reason: '관리자 새참자 예비명단 이동'
                    })
                });
                const json = await res.json();
                if (json.success) {
                    alert(`'${name}' 새참자가 예비명단으로 이동되었습니다.`);
                    await fetchNewcomers();
                } else {
                    alert(json.error || '예비명단 이동 중 오류가 발생했습니다.');
                }
            } catch (err) {
                console.error(err);
                alert('예비명단 이동 처리 중 서버 오류가 발생했습니다.');
            }
        }

        async function deleteNewcomer(id, name) {
            if (!confirm(`'${name}' 새참자를 삭제하시겠습니까?\n(해당 구역 출석체크 목록에서도 제거됩니다.)`)) return;

            try {
                const res = await fetch(`/api/newcomers/${id}`, { method: 'DELETE' });
                const json = await res.json();
                if (json.success) {
                    await fetchNewcomers();
                } else {
                    alert(json.error);
                }
            } catch (err) {
                console.error(err);
                alert("삭제 처리 중 오류가 발생했습니다.");
            }
        }

        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('faithon_user');
                window.location.href = '/login.html';
            }
        }

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
