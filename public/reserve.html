<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예비명단 관리 | FaithOn출첵</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/jpeg" href="/images/logo.jpg">
    <link rel="apple-touch-icon" href="/images/logo.jpg">
    <meta name="apple-mobile-web-app-title" content="FaithOn출첵">
    <meta name="application-name" content="FaithOn출첵">
    <meta name="theme-color" content="#1428A0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .split-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 1rem;
        }

        .reserve-mobile-tabs {
            display: none;
            gap: 8px;
            margin-bottom: 1.25rem;
            background: #e2e8f0;
            padding: 4px;
            border-radius: 10px;
        }

        .reserve-mobile-tab {
            flex: 1;
            padding: 0.6rem;
            font-size: 0.9rem;
            font-weight: 700;
            text-align: center;
            border-radius: 7px;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .reserve-mobile-tab.active {
            background: #ffffff;
            color: var(--accent-color);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }
        
        .search-box {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }
        
        .search-input {
            width: 100%;
            padding: 1rem 1rem 1rem 2.5rem;
            border-radius: 8px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition-fast);
        }
        
        .search-input:focus {
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 0 2px var(--accent-light);
        }
        
        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: var(--surface-color);
            border-radius: 8px;
            margin-bottom: 0.65rem;
            border: 1px solid var(--border-color);
            transition: var(--transition-fast);
        }
        
        .list-item:hover {
            border-color: var(--accent-color);
            background: var(--surface-hover);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .list-container {
            max-height: 520px;
            overflow-y: auto;
            padding-right: 4px;
        }

        @media (max-width: 900px) {
            .split-layout {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .reserve-mobile-tabs {
                display: flex;
            }
            .list-container {
                max-height: 380px !important;
                overflow-y: auto !important;
                -webkit-overflow-scrolling: touch;
            }
            .list-item {
                padding: 0.8rem 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- Mobile Top Bar with Quick Navigation -->
    <header class="mobile-top-bar" style="flex-direction: column; gap: 0.5rem; padding: 0.65rem 0.85rem;">
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <div class="brand-icon" style="width: 28px; height: 28px; border-radius: 6px;">
                    <img src="/images/logo.jpg" alt="FaithOn" class="brand-img-logo">
                </div>
                <span style="font-weight: 800; color: var(--accent-color); font-size: 1.1rem;">FaithOn</span>
            </div>
            <div style="display: flex; align-items: center; gap: 0.6rem;">
                <span id="mobileUserDisplay" style="font-size: 0.8rem; font-weight: 700; color: var(--accent-color); background: var(--accent-light); padding: 3px 8px; border-radius: 6px;">관리자</span>
                <button onclick="logout()" style="color: var(--danger-color); font-size: 0.9rem; padding: 4px;" title="로그아웃">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
        
        <!-- Mobile Quick Menu Pills -->
        <nav class="mobile-quick-nav" id="mobileQuickNav" aria-label="모바일 메뉴">
            <a href="/?view=dashboard" class="mobile-quick-item"><i class="fa-solid fa-chart-pie"></i> 통계</a>
            <a href="/attend.html" class="mobile-quick-item"><i class="fa-solid fa-clipboard-user"></i> 출석체크현황</a>
            <a href="/newcomer.html" class="mobile-quick-item"><i class="fa-solid fa-user-plus"></i> 새참자</a>
            <a href="/reserve.html" class="mobile-quick-item active"><i class="fa-solid fa-users-slash"></i> 예비명단</a>
            <a href="/admin_users.html" class="mobile-quick-item"><i class="fa-solid fa-user-shield"></i> 관리자</a>
        </nav>
    </header>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <img src="/images/logo.jpg" alt="FaithOn" class="brand-img-logo">
                </div>
                <div class="brand-text">FaithOn</div>
            </div>

            <nav class="nav-menu">
                <a href="/" class="nav-item" id="navDashboard">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>대시보드</span>
                </a>
                <a href="/attend.html" class="nav-item" id="navAttend">
                    <i class="fa-solid fa-clipboard-user"></i>
                    <span>출석체크현황</span>
                </a>
                <a href="/newcomer.html" class="nav-item" id="navNewcomer">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>새참자 관리</span>
                </a>
                <a href="/reserve.html" class="nav-item active" id="navReserve">
                    <i class="fa-solid fa-users-slash"></i>
                    <span>예비명단 관리</span>
                </a>
                <a href="/admin_users.html" class="nav-item" id="navAdminUsers">
                    <i class="fa-solid fa-user-shield"></i>
                    <span>관리자 설정</span>
                </a>
            </nav>

            <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
                <div id="userProfile" style="font-size: 0.85rem; margin-bottom: 0.75rem;">
                    <div style="font-weight: 600; color: var(--text-primary);" id="userNameDisplay">접속자 정보</div>
                    <div style="color: var(--text-secondary); font-size: 0.8rem;" id="userRoleDisplay">관리자</div>
                </div>
                <button class="btn btn-outline" style="width: 100%; font-size: 0.8rem; padding: 0.4rem;" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> 로그아웃
                </button>
            </div>
        </aside>

        <!-- Mobile Bottom Navigation Bar -->
        <nav class="mobile-bottom-nav">
            <div class="mobile-bottom-nav-inner">
                <a href="/" class="mobile-nav-item">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>대시보드</span>
                </a>
                <a href="/attend.html" class="mobile-nav-item" id="mobNavAttend" style="display: none;">
                    <i class="fa-solid fa-clipboard-user"></i>
                    <span>출석체크현황</span>
                </a>
                <a href="/newcomer.html" class="mobile-nav-item">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>새참자</span>
                </a>
                <a href="/reserve.html" class="mobile-nav-item active" id="mobNavReserve">
                    <i class="fa-solid fa-users-slash"></i>
                    <span>예비명단</span>
                </a>
                <a href="/admin_users.html" class="mobile-nav-item">
                    <i class="fa-solid fa-user-shield"></i>
                    <span>관리자</span>
                </a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">예비명단 관리</h1>
                    <p class="page-subtitle">출석 집계에서 제외할 성도를 예비명단으로 이동하거나 구역으로 복귀시킵니다. (관리자 전용)</p>
                </div>
            </div>

            <!-- Mobile Tab Switcher (일반 성도 검색 / 예비명단) -->
            <div class="reserve-mobile-tabs" id="reserveMobileTabs">
                <div class="reserve-mobile-tab active" id="tabNormalView" onclick="switchReserveTab('normal')">
                    <i class="fa-solid fa-users"></i> 일반 성도 검색
                </div>
                <div class="reserve-mobile-tab" id="tabReserveView" onclick="switchReserveTab('reserve')">
                    <i class="fa-solid fa-user-clock"></i> 예비명단 (<span id="mobileReserveCount">0</span>)
                </div>
            </div>

            <div class="split-layout">
                <!-- Left: Normal Members -->
                <div class="card" id="cardNormalSection">
                    <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
                        <i class="fa-solid fa-users text-primary"></i> 일반 성도 검색
                    </h3>
                    
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" class="search-input" id="normalSearchInput" placeholder="이름 또는 구역으로 검색...">
                    </div>
                    
                    <div class="list-container" id="normalList">
                        <!-- Normal Members List -->
                    </div>
                </div>

                <!-- Right: Reserve Members -->
                <div class="card" id="cardReserveSection" style="border-color: rgba(224, 122, 0, 0.3);">
                    <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; color: var(--warning-color);">
                        <i class="fa-solid fa-user-clock"></i> 예비명단 (<span id="reserveCount">0</span>명)
                    </h3>
                    
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" class="search-input" id="reserveSearchInput" placeholder="예비명단 내 검색...">
                    </div>
                    
                    <div class="list-container" id="reserveList">
                        <!-- Reserve List -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('faithon_user'));
        if (!currentUser) {
            window.location.href = '/login.html';
        }

        // 1. Check if Admin (Officer is strictly blocked)
        const isAdmin = currentUser.role === 'admin' || currentUser.scope_type === 'all';
        if (!isAdmin) {
            alert('예비명단 관리는 관리자 전용 권한입니다.');
            window.location.href = '/attend.html';
        }

        // Set sidebar user display
        document.getElementById('userNameDisplay').textContent = `${currentUser.name} (${currentUser.position || '성도'})`;
        document.getElementById('userRoleDisplay').textContent = `${currentUser.name} (${currentUser.position || '관리자'})`;
        const mobUser = document.getElementById('mobileUserDisplay');
        if (mobUser) mobUser.textContent = currentUser.name || '관리자';

        let normalMembers = [];
        let reserveMembers = [];

        const normalListEl = document.getElementById('normalList');
        const reserveListEl = document.getElementById('reserveList');
        const normalSearchInput = document.getElementById('normalSearchInput');
        const reserveSearchInput = document.getElementById('reserveSearchInput');
        const reserveCountEl = document.getElementById('reserveCount');

        async function loadData() {
            try {
                // 1. Load active members
                const mRes = await fetch('/api/members');
                const mJson = await mRes.json();
                if (mJson.success) {
                    // Filter out newcomers from normal members list for reserve management
                    normalMembers = (mJson.data || []).filter(m => !m.is_newcomer);
                }

                // 2. Load reserve members
                const rRes = await fetch('/api/reserve');
                const rJson = await rRes.json();
                if (rJson.success) {
                    reserveMembers = rJson.data || [];
                }

                renderNormalList();
                renderReserveList();
            } catch (err) {
                console.error("Load error:", err);
                alert("데이터 로드 중 오류가 발생했습니다.");
            }
        }

        function getPositionBadge(pos) {
            if (!pos || pos === '성도') return '';
            if (pos.includes('목사') || pos.includes('전도사')) {
                return `<span class="badge" style="background: rgba(147, 51, 234, 0.12); color: #7e22ce; border: 1px solid rgba(147, 51, 234, 0.3); font-weight: 700; margin-left: 5px; font-size: 0.72rem;">${pos}</span>`;
            }
            if (pos.includes('집사')) {
                return `<span class="badge" style="background: rgba(20, 40, 160, 0.08); color: var(--accent-color); border: 1px solid rgba(20, 40, 160, 0.25); font-weight: 700; margin-left: 5px; font-size: 0.72rem;">집사</span>`;
            }
            return `<span class="badge badge-success" style="margin-left: 5px; font-size: 0.72rem;">${pos}</span>`;
        }

        function renderNormalList() {
            const query = normalSearchInput.value.trim().toLowerCase();
            const filtered = normalMembers.filter(m => 
                (m.NAME && m.NAME.toLowerCase().includes(query)) || 
                (m.AREA_CODE && m.AREA_CODE.includes(query))
            );

            normalListEl.innerHTML = '';
            if (filtered.length === 0) {
                normalListEl.innerHTML = '<div style="text-align:center; padding: 2rem; color:var(--text-secondary);">검색된 성도가 없습니다.</div>';
                return;
            }

            filtered.slice(0, 50).forEach(member => {
                const div = document.createElement('div');
                div.className = 'list-item';
                const initial = (member.NAME || '성').charAt(0);
                const posBadge = getPositionBadge(member.POSITION);

                div.innerHTML = `
                    <div class="user-info">
                        <div class="avatar">${initial}</div>
                        <div>
                            <div style="font-weight: 500;">${member.NAME} ${posBadge}</div>
                            <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px;">${member.AREA_CODE}구역</div>
                        </div>
                    </div>
                    <button class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;" onclick="moveToReserve('${member.CODE_NO}', '${member.AREA_CODE}', '${member.NAME}')">
                        예비명단으로 이동 <i class="fa-solid fa-arrow-right"></i>
                    </button>
                `;
                normalListEl.appendChild(div);
            });
        }

        function renderReserveList() {
            const query = reserveSearchInput.value.trim().toLowerCase();
            const filtered = reserveMembers.filter(m => 
                (m.name && m.name.toLowerCase().includes(query)) || 
                (m.original_area && m.original_area.includes(query))
            );

            reserveCountEl.textContent = reserveMembers.length;
            const mobCnt = document.getElementById('mobileReserveCount');
            if (mobCnt) mobCnt.textContent = reserveMembers.length;
            reserveListEl.innerHTML = '';

            if (filtered.length === 0) {
                reserveListEl.innerHTML = '<div style="text-align:center; padding: 2rem; color:var(--text-secondary);">예비명단에 등록된 성도가 없습니다.</div>';
                return;
            }

            filtered.forEach(member => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.style.background = 'rgba(224, 122, 0, 0.05)';
                div.style.borderColor = 'rgba(224, 122, 0, 0.2)';
                const initial = (member.name || '성').charAt(0);
                const posBadge = getPositionBadge(member.position);

                div.innerHTML = `
                    <div class="user-info">
                        <div class="avatar" style="background: rgba(224, 122, 0, 0.15); color: var(--warning-color);">${initial}</div>
                        <div>
                            <div style="font-weight: 500;">${member.name || '미등록'} ${posBadge}</div>
                            <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px;">원래 소속: ${member.original_area || '-'}구역</div>
                        </div>
                    </div>
                    <button class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.8rem; border-color: var(--border-color);" onclick="restoreToArea('${member.member_code}', '${member.name}')">
                        <i class="fa-solid fa-arrow-left"></i> 구역 복귀
                    </button>
                `;
                reserveListEl.appendChild(div);
            });
        }

        async function moveToReserve(codeNo, areaCode, name) {
            if (!confirm(`'${name}' 성도를 예비명단으로 이동하시겠습니까?\n(이동 시 해당 구역 출석체크 대상에서 제외됩니다.)`)) return;

            try {
                const res = await fetch('/api/reserve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ member_code: codeNo, original_area: areaCode, reason: '관리자 이동' })
                });
                const json = await res.json();
                if (json.success) {
                    await loadData();
                } else {
                    alert(json.error);
                }
            } catch (err) {
                console.error(err);
                alert("이동 처리 중 오류가 발생했습니다.");
            }
        }

        async function restoreToArea(codeNo, name) {
            if (!confirm(`'${name}' 성도를 원래 구역으로 복귀시키겠습니까?`)) return;

            try {
                const res = await fetch(`/api/reserve/${encodeURIComponent(codeNo)}`, {
                    method: 'DELETE'
                });
                const json = await res.json();
                if (json.success) {
                    await loadData();
                } else {
                    alert(json.error);
                }
            } catch (err) {
                console.error(err);
                alert("복귀 처리 중 오류가 발생했습니다.");
            }
        }

        normalSearchInput.addEventListener('input', renderNormalList);
        reserveSearchInput.addEventListener('input', renderReserveList);

        function switchReserveTab(tab) {
            const isNormal = tab === 'normal';
            document.getElementById('tabNormalView').classList.toggle('active', isNormal);
            document.getElementById('tabReserveView').classList.toggle('active', !isNormal);

            const cardNormal = document.getElementById('cardNormalSection');
            const cardReserve = document.getElementById('cardReserveSection');
            
            if (window.innerWidth <= 900) {
                if (cardNormal) cardNormal.style.display = isNormal ? 'block' : 'none';
                if (cardReserve) cardReserve.style.display = isNormal ? 'none' : 'block';
            } else {
                if (cardNormal) cardNormal.style.display = 'block';
                if (cardReserve) cardReserve.style.display = 'block';
            }
        }

        window.addEventListener('resize', () => {
            if (window.innerWidth > 900) {
                const cardNormal = document.getElementById('cardNormalSection');
                const cardReserve = document.getElementById('cardReserveSection');
                if (cardNormal) cardNormal.style.display = 'block';
                if (cardReserve) cardReserve.style.display = 'block';
            } else {
                const isNormal = document.getElementById('tabNormalView').classList.contains('active');
                switchReserveTab(isNormal ? 'normal' : 'reserve');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            if (window.innerWidth <= 900) {
                switchReserveTab('normal');
            }
        });
    </script>
</body>
</html>
